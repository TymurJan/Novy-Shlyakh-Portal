# Nginx Config for Novy Shlyakh Portal & API Backend
# Location on VPS: /etc/nginx/sites-available/novyshlyakh.conf

server {
    listen 80;
    server_name novyshlyakh.org.ua www.novyshlyakh.org.ua novyshlyakh.swai.net;

    # Cloudflare / Let's Encrypt Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name novyshlyakh.org.ua www.novyshlyakh.org.ua novyshlyakh.swai.net;

    # SSL Certificates (Cloudflare / Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/novyshlyakh.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novyshlyakh.org.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root for Static Frontend Files
    root /var/www/novyshlyakh_portal;
    index index.html;

    # Static UI Files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Backend (FastAPI / Uvicorn running on port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security Headers (Talan Shield)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
