# Nginx Config for Novy Shlyakh Portal & API Backend (AlmaLinux 9 + DirectAdmin)
# Location on VPS: DirectAdmin Custom Nginx Include for novy-shlyakh.org
# Path: /usr/local/directadmin/data/users/ngotalanua/nginx.conf.custom

# API Backend Proxy (FastAPI / Uvicorn running on port 8000)
location /api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

# Static Frontend Files fallback
location / {
    root /home/ngotalanua/domains/novy-shlyakh.org/public_html;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# Security Headers (Talan Shield Protocol)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
